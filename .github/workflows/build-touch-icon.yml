name: Build iPhone Home Screen Icon
on:
  push:
    branches: [main]
    paths:
      - 'office/command-center-icon.svg'
      - '.github/workflows/build-touch-icon.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install SVG renderer
        run: python -m pip install --disable-pip-version-check 'cairosvg==2.7.1'
      - name: Render 180px PNG for iOS
        run: |
          python - <<'PY'
          import cairosvg
          cairosvg.svg2png(url="office/command-center-icon.svg",write_to="office/apple-touch-icon.png",output_width=180,output_height=180)
          from pathlib import Path
          p=Path("office/apple-touch-icon.png")
          assert p.read_bytes().startswith(b"\x89PNG\r\n\x1a\n")
          print("PNG generated:",p.stat().st_size,"bytes")
          PY
      - name: Commit icon if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add office/apple-touch-icon.png
          if ! git diff --cached --quiet; then
            git commit -m "Generate iPhone touch icon from approved SVG"
            git push
          fi
