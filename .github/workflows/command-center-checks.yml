name: Publisher Command Center Checks
on:
  pull_request:
    paths:
      - 'office/command-center.html'
      - 'office/editorial-board.html'
      - 'tests/test_editorial_board.py'
      - 'tests/test_command_center.py'
      - '.github/workflows/command-center-checks.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check command center structure and JavaScript
        run: |
          python tests/test_command_center.py
          python tests/test_editorial_board.py
