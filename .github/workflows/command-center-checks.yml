name: Publisher Command Center Checks
on:
  pull_request:
    paths:
      - 'office/command-center.html'
      - 'office/editorial-board.html'
      - 'office/technical-review.html'
      - 'office/article-editor.html'
      - 'office/media-desk.html'
      - 'tests/test_media_desk.py'
      - 'tests/test_article_editor.py'
      - 'tests/test_technical_review_desk.py'
      - 'tests/test_editorial_board.py'
      - 'tests/test_command_center.py'
      - '.github/workflows/command-center-checks.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check command center structure and JavaScript
        run: |
          python tests/test_command_center.py
          python tests/test_editorial_board.py
          python tests/test_technical_review_desk.py
          python tests/test_article_editor.py
          python tests/test_media_desk.py
