name: Publisher Command Center Checks
on:
  pull_request:
    paths:
      - 'office/command-center.html'
      - 'office/resume.html'
      - 'office/recovery.js'
      - 'tests/test_recovery.cjs'
      - 'office/coo-operations.html'
      - 'office/shared-assignments.html'
      - 'office/shared-assignments.js'
      - 'tests/test_shared_assignments.cjs'
      - 'office/coo-latest.json'
      - 'office/coo_brief.py'
      - 'tests/test_coo_brief.py'
      - 'tests/test_coo_issues.py'
      - 'office/coo_issues.py'
      - 'tests/test_coo_operations.py'
      - 'office/editorial-board.html'
      - 'office/technical-review.html'
      - 'office/article-editor.html'
      - 'office/media-desk.html'
      - 'office/media-inventory.js'
      - 'office/first-article-review.html'
      - 'office/review-repository.js'
      - 'office/review-packet.js'
      - 'tests/test_review_packet.cjs'
      - 'tests/test_review_repository.cjs'
      - 'tests/test_review_decisions.cjs'
      - 'tests/test_studio_session.cjs'
      - 'tests/test_first_article_review_packet.py'
      - 'tests/test_media_desk.py'
      - 'tests/test_article_editor.py'
      - 'tests/test_technical_review_desk.py'
      - 'tests/test_editorial_board.py'
      - 'tests/test_command_center.py'
      - '.github/workflows/command-center-checks.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check command center structure and JavaScript
        run: |
          python tests/test_command_center.py
          node tests/test_recovery.cjs
          node tests/test_shared_assignments.cjs
          python tests/test_coo_operations.py
          python tests/test_coo_brief.py
          python tests/test_coo_issues.py
          python tests/test_editorial_board.py
          python tests/test_technical_review_desk.py
          python tests/test_article_editor.py
          python tests/test_media_desk.py
          node --check office/media-inventory.js
          python tests/test_first_article_review_packet.py
          node tests/test_review_repository.cjs
          node tests/test_review_packet.cjs
          node tests/test_review_decisions.cjs
          node tests/test_studio_session.cjs
