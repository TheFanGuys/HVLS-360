name: HVLS 360 Editorial Quality Gate
on:
  pull_request:
    paths:
      - 'articles/**'
      - 'categories/**'
      - 'assets/**'
      - 'media/**'
      - 'scripts/editorial_check.py'
      - '.github/workflows/editorial-quality.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  editorial-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check editorial pages and image metadata
        run: python scripts/editorial_check.py
