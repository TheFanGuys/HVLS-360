name: Publication Safety Gate
on:
  pull_request:
    paths:
      - 'articles/**'
      - 'editorial/approvals/**'
      - 'editorial/drafts/**'
      - 'office/publication_guard.py'
      - 'office/public_catalog.py'
      - 'resources/**'
      - 'index.html'
      - 'rss.xml'
      - 'sitemap.xml'
      - 'office/article_page.py'
      - 'office/render_release.py'
      - 'tests/test_publication_guard.py'
      - 'tests/test_article_page.py'
      - 'tests/test_production_copy.py'
      - 'tests/test_public_catalog.py'
      - 'tests/test_reference_library.py'
      - '.github/workflows/publication-safety.yml'
  push:
    branches: [main]
    paths:
      - 'articles/**'
      - 'editorial/approvals/**'
      - 'editorial/drafts/**'
      - 'office/publication_guard.py'
      - 'office/public_catalog.py'
      - 'resources/**'
      - 'index.html'
      - 'rss.xml'
      - 'sitemap.xml'
      - 'office/article_page.py'
      - 'office/render_release.py'
      - '.github/workflows/publication-safety.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run publisher release audit
        run: python office/publication_guard.py
      - name: Check approved-only homepage, RSS and sitemap
        run: python office/public_catalog.py --check
      - name: Run publisher and HTML release tests
        run: |
          python -m unittest discover -s tests -p 'test_publication_guard.py' -v
          python -m unittest discover -s tests -p 'test_article_page.py' -v
          python -m unittest discover -s tests -p 'test_production_copy.py' -v
          python -m unittest discover -s tests -p 'test_public_catalog.py' -v
          python -m unittest discover -s tests -p 'test_reference_library.py' -v
