name: Research Desk Tests
on:
  pull_request:
    paths:
      - 'office/**'
      - 'tests/**'
      - '.github/workflows/research-desk-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run offline unit tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Audit all editorial draft citations and media
        run: python office/editorial_readiness.py
      - name: Check Python syntax
        run: python -m compileall -q office tests
