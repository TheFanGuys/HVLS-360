name: HVLS 360 Research Desk
on:
  workflow_dispatch:
  schedule:
    # 08:00 America/Phoenix (Arizona does not observe daylight saving time)
    - cron: '0 15 * * 2,5'
permissions:
  contents: write
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Collect research leads
        id: research
        shell: bash
        run: |
          set +e
          python office/research.py
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          if [ "$code" -ne 0 ] && [ "$code" -ne 2 ]; then
            exit "$code"
          fi
      - name: Research Director relevance audit
        if: steps.research.outputs.exit_code == '0' || steps.research.outputs.exit_code == '2'
        run: python office/research_director.py
      - name: Prepare Editor-in-Chief assignment briefs
        if: steps.research.outputs.exit_code == '0' || steps.research.outputs.exit_code == '2'
        run: python office/editorial_briefs.py
      - name: Source verification preflight
        if: steps.research.outputs.exit_code == '0' || steps.research.outputs.exit_code == '2'
        run: python office/source_preflight.py
      - name: Discover manufacturer technical research URLs
        if: steps.research.outputs.exit_code == '0' || steps.research.outputs.exit_code == '2'
        run: python office/manufacturer_research.py
      - name: Upload private research report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hvls360-research-${{ github.run_id }}
          path: |
            office/reports/*-research.md
            office/reports/research-director-latest.md
            office/reports/manufacturer-research-candidates.json
            office/reports/editorial-assignments.json
            office/reports/source-preflight.json
          if-no-files-found: error
          retention-days: 30

      - name: Publish sanitized public lead index
        if: steps.research.outputs.exit_code == '0' || steps.research.outputs.exit_code == '2'
        shell: bash
        run: |
          test -f office/research-latest.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          test -f office/editorial-latest.json
          git add office/research-latest.json office/editorial-latest.json
          if ! git diff --cached --quiet; then
            git commit -m "Update unverified research lead index [skip ci]"
            git push
          fi
