<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 1110" role="img" aria-labelledby="title desc">
<title id="title">Air circulation and outdoor-air ventilation</title>
<desc id="desc">Two stacked building sections. In the upper section, a ceiling fan pushes indoor air down, outward across the floor and back up toward the fan. All circulation arrows stay indoors. In the lower section, a separate mechanical system supplies outdoor air through one wall and exhausts indoor air through the other. These are conceptual examples, not measured airflow or a complete ventilation design.</desc>
<defs>
<marker id="mix" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0 0L6 3L0 6Z" fill="#12637b"/></marker>
<marker id="supply" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0 0L6 3L0 6Z" fill="#287345"/></marker>
<marker id="exhaust" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0 0L6 3L0 6Z" fill="#a54b16"/></marker>
<style>
text{font-family:Arial,Helvetica,sans-serif;fill:#172d3c;font-size:30px}
.heading{font-size:36px;font-weight:700}.note{fill:#405564}
.building{fill:#f0f4f6;stroke:#637987;stroke-width:4;stroke-linejoin:round}
.flow{fill:none;stroke-width:7;stroke-linecap:round;stroke-linejoin:round}
</style>
</defs>
<rect width="700" height="1110" fill="#fff"/>
<text x="30" y="44" font-weight="700">HVLS 360°</text>
<text x="30" y="97" class="heading">Indoor air circulation</text>
<text x="30" y="138" class="note">Moves air within the building</text>
<path class="building" d="M80 255L350 167L620 255V447H80Z"/>
<!-- Downward-flow mode. Return paths remain inside the building. -->
<path d="M350 171V232" stroke="#637987" stroke-width="6"/>
<path d="M248 240H452" stroke="#172d3c" stroke-width="9" stroke-linecap="round"/>
<circle cx="350" cy="240" r="13" fill="#172d3c"/>
<g class="flow" stroke="#12637b" marker-end="url(#mix)">
<path d="M350 268V366"/>
<path d="M332 386C235 424 137 402 137 340V288C137 267 180 262 225 262"/>
<path d="M368 386C465 424 563 402 563 340V288C563 267 520 262 475 262"/>
</g>
<text x="30" y="496">Indoor air recirculates.</text>
<text x="30" y="535" class="note">No outdoor-air supply shown.</text>
<path d="M30 569H670" stroke="#bac6ce" stroke-width="2"/>
<text x="30" y="622" class="heading">Outdoor-air ventilation</text>
<text x="30" y="663" class="note">Example: mechanical supply + exhaust</text>
<path class="building" d="M120 814L350 730L580 814V958H120Z"/>
<!-- Paths explicitly cross the building boundary through separate openings. -->
<rect x="108" y="824" width="24" height="46" fill="#fff" stroke="#637987" stroke-width="3"/>
<rect x="568" y="824" width="24" height="46" fill="#fff" stroke="#637987" stroke-width="3"/>
<path class="flow" stroke="#287345" marker-end="url(#supply)" d="M35 847H258"/>
<path class="flow" stroke="#a54b16" marker-end="url(#exhaust)" d="M442 847H665"/>
<text x="30" y="752" fill="#287345">Outdoor</text>
<text x="30" y="790" fill="#287345">air in</text>
<text x="522" y="752" fill="#a54b16">Indoor</text>
<text x="522" y="790" fill="#a54b16">air out</text>
<text x="30" y="1007">Air crosses the building boundary.</text>
<text x="30" y="1058" class="note">Conceptual examples • Not to scale</text>
<text x="30" y="1096" class="note">Systems can work together.</text>
</svg>
