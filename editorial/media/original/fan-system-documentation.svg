<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc"><title id="title">Fan system documentation for service and installation</title><desc id="desc">Three connected documentation stages: identify exact fan model and serial information; match the installed drive, keypad and controls; obtain the applicable technical guide and commissioning requirements. The illustration is manufacturer-neutral and not a wiring diagram.</desc><rect width="1200" height="630" fill="#0a1c2b"/><g font-family="Arial,Helvetica,sans-serif"><text x="48" y="53" fill="#7cdeec" font-size="19" letter-spacing="3">HVLS 360° / MANUFACTURER INTELLIGENCE</text><text x="48" y="102" fill="#f1f8fc" font-size="34" font-weight="bold">Know the fan. Match the controls. Use the right guide.</text><text x="48" y="135" fill="#b4ccd9" font-size="18">The service workflow for current equipment and legacy installations.</text></g><g font-family="Arial,Helvetica,sans-serif"><rect x="52" y="210" width="338" height="250" rx="19" fill="#14364a" stroke="#6fcde1" stroke-width="3"/><text x="78" y="257" fill="#81dbea" font-size="19">01 / IDENTIFY</text><text x="78" y="310" fill="#f4f9fc" font-size="29" font-weight="bold">Fan &amp; motor</text><text x="78" y="350" fill="#b8cfdb" font-size="19">Model, diameter, serial</text><text x="78" y="380" fill="#b8cfdb" font-size="19">and installed generation</text><rect x="432" y="210" width="338" height="250" rx="19" fill="#14364a" stroke="#6fcde1" stroke-width="3"/><text x="458" y="257" fill="#81dbea" font-size="19">02 / MATCH</text><text x="458" y="310" fill="#f4f9fc" font-size="29" font-weight="bold">Drive &amp; controls</text><text x="458" y="350" fill="#b8cfdb" font-size="19">Keypad, VFD, firmware</text><text x="458" y="380" fill="#b8cfdb" font-size="19">and interface sequence</text><rect x="812" y="210" width="338" height="250" rx="19" fill="#14364a" stroke="#e8b46b" stroke-width="3"/><text x="838" y="257" fill="#eec484" font-size="19">03 / VERIFY</text><text x="838" y="310" fill="#f4f9fc" font-size="29" font-weight="bold">Applicable guide</text><text x="838" y="350" fill="#b8cfdb" font-size="19">Mounting, commissioning</text><text x="838" y="380" fill="#b8cfdb" font-size="19">and approved replacements</text></g><g stroke="#7ddceb" stroke-width="5" fill="none"><path d="M390 332H430"/><path d="M770 332H810"/></g><rect x="175" y="505" width="850" height="65" rx="12" fill="#243e4c" stroke="#4d8095"/><text x="600" y="546" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="bold" fill="#e9f7fc">Brand name alone does not identify a compatible replacement.</text><text x="48" y="605" font-family="Arial,Helvetica,sans-serif" font-size="15" fill="#9ab7c8">Original editorial schematic · Not a manufacturer wiring or installation instruction</text></svg>