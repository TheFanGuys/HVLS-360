<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 670" role="img" aria-labelledby="title desc">
<title id="title">HVLS installation access planning with a scissor lift</title>
<desc id="desc">Conceptual warehouse cross-section showing an HVLS ceiling fan, a scissor lift positioned below the work point, overhead sprinkler and light obstructions, a marked ground traffic exclusion zone and a separate materials staging area. The illustration does not prescribe a safe lift position or clearance distance.</desc>
<defs><linearGradient id="bg" x2="0" y2="1"><stop stop-color="#0a1b2a"/><stop offset="1" stop-color="#102e42"/></linearGradient><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="#6cdded"/></marker></defs>
<rect width="1200" height="670" fill="url(#bg)"/>
<g font-family="Arial,Helvetica,sans-serif" fill="#eaf5fc"><text x="52" y="54" font-size="19" fill="#7fd9ed" letter-spacing="3">HVLS 360° / FIELD PLANNING</text><text x="52" y="102" font-size="35" font-weight="bold">Plan the access before the lift arrives.</text><text x="52" y="135" font-size="17" fill="#b6ccda">A site survey should consider the work point, overhead conflicts, floor route and traffic.</text></g>
<path d="M100 230L600 170L1100 230" stroke="#8da9b9" stroke-width="14" fill="none"/><path d="M100 230V564H1100V230" stroke="#58788a" stroke-width="7" fill="none"/><path d="M110 564H1090" stroke="#aac0ca" stroke-width="8"/>
