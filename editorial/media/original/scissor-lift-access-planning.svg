<g stroke="#edbb72" stroke-width="10" fill="none"><path d="M205 290H385"/><path d="M805 290H1005"/></g><g fill="#edbb72"><circle cx="215" cy="290" r="9"/><circle cx="985" cy="290" r="9"/></g>
<g stroke="#91b6c6" stroke-width="7" fill="none"><path d="M385 345H465"/><path d="M735 345H805"/></g>
