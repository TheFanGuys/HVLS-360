<rect x="438" y="565" width="322" height="36" rx="5" fill="#f4b45f" opacity=".22"/><path d="M438 565H760" stroke="#f4b45f" stroke-width="4" stroke-dasharray="10 8"/>
<g font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#eaf5fc"><text x="70" y="350" font-weight="bold">Overhead conflicts</text><text x="70" y="377" fill="#b7ccda">Sprinklers, lighting, trays</text><path d="M260 330L310 295" stroke="#6cdded" stroke-width="3" marker-end="url(#arrow)"/><text x="810" y="395" font-weight="bold">Work position</text><text x="810" y="422" fill="#b7ccda">Verify actual reach</text><path d="M820 433L720 416" stroke="#6cdded" stroke-width="3" marker-end="url(#arrow)"/><text x="790" y="510" font-weight="bold">Traffic control</text><text x="790" y="537" fill="#b7ccda">Keep vehicles clear</text><path d="M792 545L738 580" stroke="#6cdded" stroke-width="3" marker-end="url(#arrow)"/><text x="80" y="490" font-weight="bold">Floor and access route</text><text x="80" y="517" fill="#b7ccda">Inspect slopes and obstacles</text><path d="M310 527L454 556" stroke="#6cdded" stroke-width="3" marker-end="url(#arrow)"/></g>
<text x="52" y="638" font-family="Arial,Helvetica,sans-serif" font-size="15" fill="#a5bfce">Conceptual illustration · Not to scale · Follow the actual lift manual and site-specific work plan</text>
