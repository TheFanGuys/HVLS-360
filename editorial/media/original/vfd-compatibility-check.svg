<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc"><title id="title">HVLS variable-frequency drive compatibility decision map</title><desc id="desc">Conceptual flow diagram showing an exact fan and motor model, the original equipment manufacturer's approved drive and control system, environmental rating checks, and field commissioning. No electrical wiring or interlock circuit is specified.</desc><defs><linearGradient id="bg" x2="0" y2="1"><stop stop-color="#091b2b"/><stop offset="1" stop-color="#123147"/></linearGradient><marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0L8 4.5L0 9Z" fill="#7cd7e9"/></marker></defs><rect width="1200" height="630" fill="url(#bg)"/><g font-family="Arial,Helvetica,sans-serif"><text x="48" y="54" fill="#80d8eb" font-size="19" letter-spacing="3">HVLS 360° / CONTROLS &amp; VFDs</text><text x="48" y="100" fill="#f1f7fc" font-size="33" font-weight="bold">An enclosure rating is not a compatibility approval.</text><text x="48" y="133" fill="#b6cbd9" font-size="17">Use the exact OEM documentation to establish the complete fan system's requirements.</text></g><g font-family="Arial,Helvetica,sans-serif"><rect x="55" y="205" width="300" height="192" rx="18" fill="#183a50" stroke="#4c859d" stroke-width="3"/><text x="80" y="251" fill="#86dbea" font-size="18">01 / FAN SYSTEM</text><text x="80" y="292" fill="#f4f9fc" font-size="24" font-weight="bold">Exact motor &amp; fan</text><text x="80" y="329" fill="#bfd2df" font-size="17">Voltage, motor type,</text><text x="80" y="356" fill="#bfd2df" font-size="17">controls and revision</text><rect x="450" y="205" width="300" height="192" rx="18" fill="#183a50" stroke="#7fd4e8" stroke-width="3"/><text x="475" y="251" fill="#86dbea" font-size="18">02 / OEM VALIDATION</text><text x="475" y="292" fill="#f4f9fc" font-size="23" font-weight="bold">Approved drive?</text><text x="475" y="329" fill="#bfd2df" font-size="17">Motor, keypad, sequence</text><text x="475" y="356" fill="#bfd2df" font-size="17">and required protections</text><rect x="845" y="205" width="300" height="192" rx="18" fill="#183a50" stroke="#eab86c" stroke-width="3"/><text x="870" y="251" fill="#f0c482" font-size="18">03 / INSTALLATION</text><text x="870" y="292" fill="#f4f9fc" font-size="23" font-weight="bold">Environment &amp; setup</text><text x="870" y="329" fill="#bfd2df" font-size="17">Ambient, sun, mounting,</text><text x="870" y="356" fill="#bfd2df" font-size="17">commissioning and AHJ</text><path d="M355 300H440M750 300H835" stroke="#7cd7e9" stroke-width="6" fill="none" marker-end="url(#arr)"/><rect x="270" y="453" width="660" height="76" rx="14" fill="#2a3d47" stroke="#7eacbd"/><text x="600" y="486" text-anchor="middle" fill="#f1f7fc" font-size="22" font-family="Arial,Helvetica,sans-serif" font-weight="bold">No OEM approval? Stop and verify before substitution.</text><text x="600" y="512" text-anchor="middle" fill="#bcd2dc" font-size="16" font-family="Arial,Helvetica,sans-serif">IP66 and UL Type 4X are separate ratings; neither establishes fan compatibility.</text><text x="52" y="593" fill="#9bb9c9" font-size="15" font-family="Arial,Helvetica,sans-serif">Conceptual selection guide · Not a wiring diagram or manufacturer approval</text></g></svg>