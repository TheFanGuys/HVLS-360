<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow,noarchive"><title>Produced drafts | HVLS 360</title><style>body{margin:0;background:#f5f5f1;color:#172a39;font:17px/1.6 system-ui}main{max-width:850px;margin:auto;padding:24px 20px}a{color:#12608b;overflow-wrap:anywhere}h1{font:700 36px Georgia,serif}article{border-top:3px solid #f58220;padding:20px 0}h2{font-size:23px;line-height:1.3}nav{display:flex;gap:24px;flex-wrap:wrap}.meta{color:#526774;font-size:14px}.error{color:#9e281b}</style><main><a href="command-center.html">← Command Center</a><h1>Produced drafts</h1><p>Read new articles and their review records here. These drafts await your editorial decision; publication requires separate authorization.</p><p id="state" role="status">Loading saved production queue…</p><section id="drafts"></section><p class="meta">Original launch articles remain in <a href="first-article-review.html">Review Studio</a>.</p></main><script>
(async()=>{'use strict';const status=document.getElementById('state'),list=document.getElementById('drafts');try{const r=await fetch('production-queue.json',{cache:'no-store'});if(!r.ok)throw Error('Queue read failed');const q=await r.json();if(q.publication_allowed!==false||!Array.isArray(q.items))throw Error('Invalid queue');const seen=new Set;for(const x of q.items){if(!Number.isInteger(x.assignment_issue)||!Number.isInteger(x.draft_pr)||!(/^[a-f0-9]{40}$/.test(x.draft_head_sha))||x.publication_allowed!==false||seen.has(x.assignment_issue))throw Error('Invalid draft record');seen.add(x.assignment_issue);const a=document.createElement('article'),h=document.createElement('h2'),p=document.createElement('p'),s=document.createElement('p'),nav=document.createElement('nav');h.textContent=x.title;p.textContent=x.audience;s.className='meta';s.textContent=x.status==='founder_review'?'Ready for your first text review':x.status.replaceAll('_',' ');a.append(h,p,s);const links=[['Read article','https://github.com/TheFanGuys/HVLS-360/blob/'+x.draft_head_sha+'/editorial/production/issue-'+x.assignment_issue+'/manuscript.md'],['Review package','https://github.com/TheFanGuys/HVLS-360/pull/'+x.draft_pr]];for(const [label,url]of links){const link=document.createElement('a');link.textContent=label;link.href=url;nav.append(link);}a.append(nav);list.append(a);}status.textContent=q.items.length?q.items.length+' produced draft'+(q.items.length===1?'':'s')+' saved.':'No produced drafts yet.';}catch(e){list.replaceChildren();status.className='error';status.textContent='The production queue could not load. Open the shared assignment board to inspect delivery.';}})();
</script></html>
